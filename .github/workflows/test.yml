name: tests
on:
  pull_request:
  push:
    branches: [main, dev, 'upgrade/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path harness/Cargo.toml --check
      - run: cargo test --locked --manifest-path harness/Cargo.toml --lib --bin harness --test responses
      - run: cargo test --locked --manifest-path worktrees/Cargo.toml
      - run: python3 -m unittest discover -s harness/tests -p 'test_*.py'
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build the CRAFT packages and test their bundled-verifier workflow
        run: |
          nix build --no-link --no-update-lock-file .#runtimeSource .#buildTools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          nix develop --no-update-lock-file --command bash -euc '
            export CARGO_TARGET_DIR="$RUNNER_TEMP/craft-target"
            cd "$EUREKA_NIX_SOURCE_PATH"
            elan toolchain install "$(cat examples/core/lean-toolchain)"
            cargo test --locked --manifest-path harness/Cargo.toml --bin harness
            cargo test --locked --manifest-path harness/Cargo.toml --test lake_verifier -- --ignored
          '
  native-beam:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lean: [v4.35.0, v4.36.0-rc2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Lean and Bubblewrap
        env:
          TOOLCHAIN: leanprover/lean4:${{ matrix.lean }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap cmake libgmp-dev
          curl --fail --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the pinned Beam for this compiler
        env:
          TOOLCHAIN: leanprover/lean4:${{ matrix.lean }}
        run: |
          lean_bin=$(ELAN_TOOLCHAIN="$TOOLCHAIN" elan which lean)
          lean_prefix=$(dirname "$(dirname "$lean_bin")")
          cmake -DLEAN_PREFIX="$lean_prefix" -P lean-beam/scripts/build-toolchain.cmake
          # RC SDKs already contain Beam; replace only its contribution on this disposable runner.
          chmod -R u+w "$lean_prefix/bin" "$lean_prefix/lib/lean-beam" 2>/dev/null || true
          cmake -DLEAN_PREFIX="$lean_prefix" -DPREFIX="$lean_prefix" -P lean-beam/scripts/install-toolchain.cmake
          echo "HARNESS_BEAM_MCP=$lean_prefix/bin/lean-beam-mcp" >> "$GITHUB_ENV"
      - name: Exercise MCP and the bundled verifier
        env:
          HARNESS_LEAN_TOOLCHAIN: leanprover/lean4:${{ matrix.lean }}
        run: |
          # Ubuntu restricts unprivileged user namespaces for unknown executables.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          systemd-run --user --wait --pipe --quiet true
          cargo test --locked --manifest-path harness/Cargo.toml --test beam_surface --test lake_verifier -- --ignored --nocapture
      - name: Exercise all Lean workflows through the Docker harness
        if: matrix.lean == 'v4.35.0'
        env:
          HARNESS_IMAGE: eureka-workflow-test
          HARNESS_PACKAGES: ${{ runner.temp }}/empty-packages
        run: |
          mkdir -p "$HARNESS_PACKAGES"
          sdk=$(dirname "$(dirname "$HARNESS_BEAM_MCP")")
          docker build -t "$HARNESS_IMAGE" -f - "$sdk" <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends git libgmp10 libuv1t64 tzdata && rm -rf /var/lib/apt/lists/*
          COPY . /opt/lean
          RUN mkdir -p /opt/elan/toolchains && ln -s /opt/lean /opt/elan/toolchains/leanprover--lean4---v4.35.0
          DOCKERFILE
          cargo build --locked --manifest-path harness/Cargo.toml
          python3 harness/tests/lifecycle.py -v Lifecycle.test_workflow_guides_and_outcomes \
            Lifecycle.test_formalization_across_an_import Lifecycle.test_review_detects_source_changes_before_reporting
  checks:
    if: always()
    needs: [regression, native-beam, nix]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test job to pass
        env:
          REGRESSION: ${{ needs.regression.result }}
          NIX: ${{ needs.nix.result }}
          NATIVE_BEAM: ${{ needs.native-beam.result }}
        run: test "$REGRESSION" = success && test "$NATIVE_BEAM" = success && test "$NIX" = success
